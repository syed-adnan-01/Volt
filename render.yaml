services:
  - type: redis
    name: volt-redis
    plan: free
    ipAllowList: []

  - type: web
    name: volt-prediction-service
    env: docker
    dockerfilePath: ./services/prediction-service/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "8000"

  - type: web
    name: volt-routing-service
    env: docker
    dockerfilePath: ./services/routing-service/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production

  - type: web
    name: volt-api
    env: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: volt-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: volt-redis
          property: connectionString
      - key: ML_API_URL
        value: http://volt-prediction-service:8000
      - key: OPTIMIZER_SERVICE_URL
        value: http://volt-routing-service:3001
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org

databases:
  - name: volt-db
    databaseName: volt_db
    user: volt_user
    plan: free
